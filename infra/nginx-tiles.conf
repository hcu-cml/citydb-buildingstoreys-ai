server {
    listen 80 default_server;
    server_name _;

    add_header Access-Control-Allow-Origin  "*"      always;
    add_header Access-Control-Allow-Methods "GET"    always;
    add_header Access-Control-Allow-Headers "Range, Origin, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Per-project run is selected via outputs/<project>/current symlink,
    # written by stage 5 (see src/bfe/citygml/visualize.py).
    location /tiles/ {
        alias /usr/share/nginx/html/outputs/heidelberg/current/tiles/;
        autoindex on;
        types {
            application/json   json;
            model/gltf-binary  glb b3dm;
            application/octet-stream cmpt i3dm pnts;
        }
    }

    location /3dwebmc/ {
        alias /usr/share/nginx/html/outputs/heidelberg/current/3dwebmc/;
        types {
            application/json json;
        }
    }

    location /outputs/ {
        autoindex on;
    }

    location = / {
        return 302 /viewer.html;
    }
    location /viewer.html {
        alias /usr/share/nginx/html/web/viewer.html;
    }
    location /web/ {
        alias /usr/share/nginx/html/web/;
    }
}
