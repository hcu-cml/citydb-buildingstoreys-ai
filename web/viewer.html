<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Building storeys (Cesium)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css">
<style>
  html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
  #legend {
    position: absolute; top: 12px; left: 12px; z-index: 999;
    background: rgba(0,0,0,0.65); color: white; font: 13px/1.4 system-ui;
    padding: 10px 14px; border-radius: 6px;
  }
  #legend b { font-size: 12px; letter-spacing: 0.05em; }
  #legend ul { margin: 6px 0 0; padding: 0; list-style: none; }
  #legend li { display: flex; align-items: center; }
  #legend i { width: 14px; height: 14px; margin-right: 8px; border: 1px solid #444; display: inline-block; }
  #status {
    position: absolute; bottom: 12px; left: 12px; z-index: 999;
    background: rgba(0,0,0,0.65); color: white; font: 12px/1.4 monospace;
    padding: 6px 10px; border-radius: 4px; max-width: 50ch;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="legend">
  <b>floors (predicted)</b>
  <ul>
    <li><i style="background:cyan"></i> 2</li>
    <li><i style="background:magenta"></i> 3</li>
    <li><i style="background:yellow"></i> 4</li>
    <li><i style="background:#0f0"></i> 5</li>
    <li><i style="background:gray"></i> unknown</li>
  </ul>
</div>
<div id="status">loading…</div>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
<script>
  const status = document.getElementById('status');
  const log = msg => { status.textContent = msg; };

  Cesium.Ion.defaultAccessToken = undefined;

  (async () => {
    let imageryProvider;
    try {
      imageryProvider = await Cesium.ArcGisMapServerImageryProvider.fromUrl(
        'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
      );
    } catch (err) {
      console.warn('ArcGIS imagery failed; falling back to OpenStreetMap', err);
      imageryProvider = new Cesium.OpenStreetMapImageryProvider({
        url: 'https://tile.openstreetmap.org/'
      });
    }

    const viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayer: Cesium.ImageryLayer.fromProviderAsync(Promise.resolve(imageryProvider)),
      terrainProvider: new Cesium.EllipsoidTerrainProvider(),
      baseLayerPicker: false,
      geocoder:        false,
      sceneModePicker: false,
      timeline:        false,
      animation:       false,
      homeButton:      false,
      fullscreenButton: true,
    });

    const heidelberg = Cesium.Rectangle.fromDegrees(8.6277, 49.3101, 8.7387, 49.4372);
    viewer.camera.setView({ destination: heidelberg });

    const tileset_style = new Cesium.Cesium3DTileStyle({
      color: {
        conditions: [
          ["Number(${floors}) === 2", "color('cyan')"],
          ["Number(${floors}) === 3", "color('magenta')"],
          ["Number(${floors}) === 4", "color('yellow')"],
          ["Number(${floors}) === 5", "color('green')"],
          ["true",                    "color('gray')"]
        ]
      }
    });

    const tilesetUrl = '/tiles/tileset.json';
    log('fetching ' + tilesetUrl);

    try {
      const tileset = await Cesium.Cesium3DTileset.fromUrl(tilesetUrl, { skipLevelOfDetail: true });
      tileset.style = tileset_style;
      viewer.scene.primitives.add(tileset);
      log('tileset loaded');

      const handler = new Cesium.ScreenSpaceEventHandler(viewer.canvas);
      handler.setInputAction((click) => {
        const picked = viewer.scene.pick(click.position);
        if (picked instanceof Cesium.Cesium3DTileFeature) {
          const props = {};
          for (const name of picked.getPropertyIds()) {
            props[name] = picked.getProperty(name);
          }
          log('feature: ' + JSON.stringify(props));
        }
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

      try {
        await viewer.zoomTo(tileset);
      } catch {
        log('tileset has no extent; camera held on Heidelberg');
      }
    } catch (err) {
      log('tileset load failed: ' + err.message);
      console.error(err);
    }
  })().catch(err => {
    log('init failed: ' + err.message);
    console.error(err);
  });
</script>
</body>
</html>
