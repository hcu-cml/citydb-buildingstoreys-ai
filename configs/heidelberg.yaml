# Heidelberg, Germany: end-to-end pipeline configuration.
#
# Inputs:
#   - LoD2/LoD3 CityGML-derived building footprints exported as GeoJSON,
#     typically in EPSG:25832 (ETRS89 / UTM zone 32N) as published by
#     German state geoportals (e.g. LGL Baden-Wuerttemberg).
#   - Mapillary Graph API street-level imagery inside the bounding box.
#
# Outputs:
#   - outputs/heidelberg/<run_id>/ (see README.md).

project: heidelberg

footprint:
  kind: file
  # Drop the CityGML-derived GeoJSON here, or point to its absolute path.
  path: ../data/Heidelberg_Center_Buildings_Storeys_CityGML_2025.geojson
  # The source publishes coordinates in UTM zone 32N; override if missing.
  crs: EPSG:25832
  id_field: id
  height_field: storeysAboveGround

mapillary:
  bbox:
    min_lon: 8.627700
    min_lat: 49.310153
    max_lon: 8.738668
    max_lat: 49.437231
  grid_divisions: 4
  search_radius_m: 150.0
  bearing_tolerance_deg: 90.0
  max_images_per_building: 1
  request_limit: 2000
  max_pages_per_cell: 20
  request_timeout_s: 30.0
  per_cell_sleep_s: 2.0
  per_page_sleep_s: 1.0

detector:
  weights: ../models/best.pt
  confidence_threshold: 0.15
  iou_threshold: 0.12
  device: auto
  target_class: window

floor_estimator:
  min_windows: 8
  max_floors: 5
  avg_floor_height_m: 2.5

outputs:
  root: ../outputs
  run_id: null
