# Heidelberg, Germany: end-to-end pipeline configuration.
#
# Inputs:
#   - LoD2 CityGML file under data/. Stage 0 extracts a bbox-rectangle
#     GeoJSON from it; the bbox-extraction algorithm matches the published
#     paper.
#   - Mapillary Graph API street-level imagery inside the bounding box.
#
# Outputs:
#   - outputs/heidelberg/<run_id>/ (see README.md).

project: heidelberg

footprint:
  kind: citygml
  citygml_path: ../data/heidelberg_center_citygml2_lod2_2025.gml
  # `path` is auto-set at runtime to <run>/stage0_extract/footprints.geojson.
  crs: EPSG:25832
  id_field: id
  height_field: storeysAboveGround

mapillary:
  bbox:
    min_lon: 8.627700
    min_lat: 49.310153
    max_lon: 8.738668
    max_lat: 49.437231
  grid_divisions: 4
  search_radius_m: 150.0
  bearing_tolerance_deg: 90.0
  max_images_per_building: 1
  request_limit: 2000
  max_pages_per_cell: 20
  request_timeout_s: 30.0
  per_cell_sleep_s: 2.0
  per_page_sleep_s: 1.0

detector:
  weights: ../models/best.pt
  confidence_threshold: 0.15
  iou_threshold: 0.12
  device: auto
  target_class: window

floor_estimator:
  min_windows: 8
  max_floors: 5
  avg_floor_height_m: 2.5

outputs:
  root: ../outputs
  run_id: null

enrichment:
  enabled: true
  citydb:
    host: citydb-postgres
    port: 5432
    database: heidelberg_citydb5
    user: postgres
    # BFE_CITYDB_PASSWORD is read from the .env file.

visualization:
  enabled: true
  basemap: arcgis
  styling:
    by: storeysAboveGround
    color_rule:
      "2": cyan
      "3": magenta
      "4": yellow
      "5": green
      default: gray
  nginx_port: 8080
  viewer_port: 8000
